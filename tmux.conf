# START keybinds
unbind C-b
set -g prefix `
bind ` send-prefix

unbind %
bind | split-window -h 

unbind '"'
bind - split-window -v

bind C-s set synchronize-panes

# hjkl pane traversal
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes with HJKL (shift + vim keys)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Better copy mode bindings
bind Enter copy-mode
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle

# Reload config quickly
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

# Clear screen and history
bind C-l send-keys C-l \; clear-history

# Renumber windows
bind C-r move-window -r

# Tree pickers: most recent output first, with last-output time per window
bind s choose-tree -Zs -O time -F '#{?window_format,#{window_name}#{window_flags}#{E:@pi_status_icons} [#{t/p:window_activity}]: "#{pane_title}",#{?pane_format,#{pane_current_command}#{?@pi_status, [#{@pi_status}],}: "#{pane_title}",#{session_windows} windows#{?session_attached, (attached),}}}'
bind w choose-tree -Zw -O time -F '#{?window_format,#{window_name}#{window_flags}#{E:@pi_status_icons} [#{t/p:window_activity}]: "#{pane_title}",#{?pane_format,#{pane_current_command}#{?@pi_status, [#{@pi_status}],}: "#{pane_title}",#{session_windows} windows#{?session_attached, (attached),}}}'

# Forward modified keys (e.g. Shift+Enter) to apps as CSI u; pi needs this (pi docs/tmux.md)
set -g extended-keys on
set -g extended-keys-format csi-u

# END keybinds

# START statusbar
# Set statusbar on top
set -g status-position top
set -g base-index 1
setw -g pane-base-index 1

set -g status-interval 5
set -g automatic-rename on
set -g automatic-rename-format "#{?#{==:#{pane_current_command},zsh},#{b:pane_current_path},#{pane_current_command}}"

# Let tmux own the terminal title so Pi's OSC-0 title doesn't get stuck after it exits.
# #W (window name) auto-reverts via automatic-rename; dropping #T drops the stale pane title.
set -g set-titles on
set -g set-titles-string "#S:#I:#W"

setw -g mouse on
setw -g mode-keys vi

# Increase scrollback buffer
set -g history-limit 10000

# No delay after Escape, so vim and pi see Escape at once
set -s escape-time 0

# Activity monitoring
setw -g monitor-activity on
set -g visual-activity on
# Flag windows (~) after 120s with no output: a Pi session waiting for input
setw -g monitor-silence 120
# Flag only: no bell (Terminal.app shows a bell as a screen flash)
set -g silence-action none

set -g default-terminal "tmux-256color"

# set -g @catppuccin_flavor "mocha"
# set -g @catppuccin_window_status_style "rounded"
# 
# # Load catppuccin
# run ~/.tmux/plugins/tmux/catppuccin.tmux
# 
# # Make the status line pretty and add some modules
# set -g status-right-length 100
# set -g status-left-length 100
# set -g status-left ""
# set -g status-right "#{E:@catppuccin_status_application}"
# set -ag status-right "#{E:@catppuccin_status_session}"
# set -ag status-right "#{E:@catppuccin_status_uptime}"

# Catppuccin options (must be before plugin declaration)
set -g @catppuccin_flavor "latte"

set -g @catppuccin_window_number_position "right"

# catppuccin v2 renamed this var; the old _default_text was ignored, so inactive
# windows fell back to the plugin default (#T = pane title), which is where Pi's
# OSC-0 title got stuck. #W (window name) auto-reverts via automatic-rename.
# Pi state per pane, set by ~/.pi/agent/extensions/tmux-status.ts (tmux drops Pi's OSC 7501).
# #{P:} loops over every pane, so a Pi in a non-active pane still shows.
set -g @pi_status_icons '#{P:#{?#{==:#{@pi_status},working}, 󰔟,}#{?#{==:#{@pi_status},blocked}, 󰋗,}#{?#{==:#{@pi_status},done}, 󰄬,}#{?#{==:#{@pi_status},error}, 󰀨,}}'
set -g @catppuccin_window_text "#W#{E:@pi_status_icons}"
set -g @catppuccin_window_current_text "#W#{E:@pi_status_icons}"

set -g @catppuccin_status_left_separator  " "
set -g @catppuccin_status_right_separator ""
set -g @catppuccin_status_connect_separator "no"

# Status module (catppuccin v2 dropped @catppuccin_status_modules_right).
# tpm loads catppuccin below; E: expands the module when the status line draws.
set -g status-right "#{E:@catppuccin_status_session}"

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'wfxr/tmux-fzf-url' # prefix-u to fzf links on screen
set -g @plugin 'catppuccin/tmux#v2.3.2'
set -g @plugin 'Morantron/tmux-fingers'
# Skip the plugin's prefix F/J bindings (no jump mode); the guard below binds F.
set -g @fingers-enable-bindings 0


# Bootstrap TMUX plugin manager if not installed
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

# Initialize TMUX plugin manager (keep this line below all plugin settings; the fingers guard must follow it)
run '~/.tmux/plugins/tpm/tpm'

# Guard tmux-fingers: it crashes and leaves the session half-swapped when the
# pane's directory no longer exists. Check the directory first.
bind F if-shell '[ -d #{q:pane_current_path} ]' \
  "run-shell -b '#{@fingers-cli} start #{pane_id} >>$HOME/.local/state/tmux-fingers/fingers.log 2>&1'" \
  'display-message "fingers: pane directory is gone: #{pane_current_path}"'

# Readable prompt and message bar: catppuccin's teal on overlay_0 is 1.4:1 in
# latte; text on surface_0 is 5.2:1. Must follow tpm, which sets these styles.
set -gF message-style "fg=#{@thm_fg},bg=#{@thm_surface_0},fill=#{@thm_surface_0}"
set -gF message-command-style "fg=#{@thm_fg},bg=#{@thm_surface_0},fill=#{@thm_surface_0}"
